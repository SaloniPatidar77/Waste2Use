{% extends "base.html" %}
{% block title %}Your Impact Stats{% endblock %}

{% block content %}
<section class="card" style="max-width:800px;margin:auto;text-align:center;padding:25px;background:linear-gradient(135deg,#e8f5e9,#f1f8e9);
border-radius:25px;box-shadow:0 6px 15px rgba(0,0,0,0.15);">
  <h2 style="font-size:28px;color:#2e7d32;">🌿 Your Waste2Use Journey</h2>
  <p style="color:#555;">See how much impact you've made towards a cleaner planet!</p>
  <canvas id="statsChart" style="max-width:100%; height:400px; margin-top:20px;"></canvas>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    const data = JSON.parse('{{ data | tojson | safe }}');

    const ctx = document.getElementById('statsChart').getContext('2d');

    const gradient1 = ctx.createLinearGradient(0, 0, 0, 400);
    gradient1.addColorStop(0, '#81c784');
    gradient1.addColorStop(1, '#388e3c');

    const gradient2 = ctx.createLinearGradient(0, 0, 0, 400);
    gradient2.addColorStop(0, '#a5d6a7');
    gradient2.addColorStop(1, '#66bb6a');

    const gradient3 = ctx.createLinearGradient(0, 0, 0, 400);
    gradient3.addColorStop(0, '#c8e6c9');
    gradient3.addColorStop(1, '#43a047');

    new Chart(ctx, {
      type: 'bar',
      data: {
        labels: ['Waste Saved (kg)', 'Posts', 'Tree Equivalent 🌳'],
        datasets: [{
          data: [data.total_waste_saved, data.total_posts, data.tree_equivalent],
          backgroundColor: [gradient1, gradient2, gradient3],
          borderRadius: 12,
          borderWidth: 2,
          borderColor: '#2e7d32',
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: { display: false },
          title: {
            display: true,
            text: '💚 Your Positive Impact 💚',
            font: { size: 18, weight: 'bold' },
            color: '#1b5e20'
          },
          tooltip: {
            backgroundColor: '#e8f5e9',
            titleColor: '#2e7d32',
            bodyColor: '#1b5e20',
            borderColor: '#66bb6a',
            borderWidth: 1,
            displayColors: false
          }
        },
        animation: {
          duration: 1600,
          easing: 'easeOutBounce'
        },
        scales: {
          y: {
            beginAtZero: true,
            grid: { color: '#c8e6c9' },
            ticks: { color: '#2e7d32', font: { size: 14 } }
          },
          x: {
            ticks: { color: '#2e7d32', font: { size: 14 } },
            grid: { display: false }
          }
        }
      }
    });
  </script>
</section>
{% endblock %}
