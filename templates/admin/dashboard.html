{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h1>🛠 Admin Dashboard</h1>

    <div class="row mt-4">
        <div class="col-md-6">
            <div class="card p-3">
                <h3>Total Users</h3>
                <h1>{{ total_users }}</h1>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card p-3">
                <h3>Total Posts</h3>
                <h1>{{ total_posts }}</h1>
            </div>
        </div>
    </div>

    <hr>
    <h2>📮 All Posts</h2>
    {% for post in posts %}
    <div class="card p-3 mt-3" id="post-{{ post.id }}">
        <h4>{{ post.author.username }}</h4>
        <p>{{ post.content }}</p>
        {% if post.media %}
        <img src="{{ url_for('static', filename='uploads/' + post.media) }}"
             width="250">
        {% endif %}
        <br><br>
        <button
            class="btn btn-danger admin-delete-btn"
            data-post-id="{{ post.id }}"
        >
            Delete Post
        </button>
    </div>

    {% endfor %}

</div>
<script>
document.addEventListener("click", async function(e){

    if(e.target.closest(".admin-delete-btn")){

        let btn = e.target.closest(".admin-delete-btn");
        let postId = btn.dataset.postId;
        let res = await fetch(`/admin/delete-post/${postId}`,{
            method:"POST"
        });

        let data = await res.json();
        if(data.status === "ok"){

            document.getElementById(
                `post-${postId}`
            ).remove();
            }

    }
});

</script>

{% endblock %}
