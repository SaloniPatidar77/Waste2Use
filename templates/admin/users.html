<h2>👥 All Users</h2>

<table border="1" cellpadding="10">
    <tr>
        <th>ID</th>
        <th>Username</th>
        <th>Email</th>
        <th>Role</th>
        <th>Action</th>
    </tr>

    {% for user in users %}
    <tr>
        <td>{{ user.id }}</td>
        <td>{{ user.username }}</td>
        <td>{{ user.email }}</td>
        <td>{{ user.role }}</td>
        <td>
            <a href="/admin/delete-user/{{ user.id }}" 
               onclick="return confirm('Delete this user?')">
               ❌ Delete
            </a>
        </td>
    </tr>
    {% endfor %}
</table>
